<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="860" height="640" fill="#ffffff"/>
  <text x="30" y="32" font-size="19" font-weight="bold" fill="#111111">P19's one open question, drawn</text>
  <text x="30" y="54" font-size="12.5" fill="#444444">Solid lines are measured or vendor-stated. Dashed lines are unmeasured. The whole lab waits on one of the dashed ones.</text>

  <text x="30" y="92" font-size="14" font-weight="bold" fill="#5b2d82">Plan view, looking down on the Raspberry Pi 3 Model B</text>

  <rect x="40" y="108" width="306" height="202" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/>
  <text x="193" y="300" font-size="11.5" fill="#555555" text-anchor="middle">Raspberry Pi 3 Model B, 85 mm x 56 mm (vendor)</text>

  <rect x="66" y="120" width="183" height="18" fill="#e4edf7" stroke="#1f4e79"/>
  <rect x="66" y="120" width="119" height="18" fill="#cfe0f2" stroke="#1f4e79"/>
  <text x="125" y="133" font-size="10.5" fill="#111111" text-anchor="middle">pins 1 to 26</text>
  <text x="217" y="133" font-size="10.5" fill="#111111" text-anchor="middle">27 to 40</text>
  <text x="66" y="152" font-size="10.5" fill="#666666">40-pin header, 50.8 mm of 2.54 mm pitch</text>

  <rect x="40" y="108" width="306" height="202" fill="none" stroke="#7b4397" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="356" y="200" font-size="11.5" fill="#5b2d82">The panel's carrier board:</text>
  <text x="356" y="218" font-size="11.5" fill="#5b2d82">its glass is about 55 mm by</text>
  <text x="356" y="236" font-size="11.5" fill="#5b2d82">85 mm (vendor drawing), and</text>
  <text x="356" y="254" font-size="11.5" fill="#5b2d82">the wiki says "same size as</text>
  <text x="356" y="272" font-size="11.5" fill="#5b2d82">your Raspberry Pi 3 / 4 / 5".</text>
  <text x="356" y="296" font-size="11.5" font-weight="bold" fill="#b7791f">Its true outline is unmeasured.</text>

  <path d="M 186 100 L 186 84 L 249 84 L 249 100" fill="none" stroke="#e07b39" stroke-width="1.5"/>
  <text x="218" y="78" font-size="11" fill="#c0392b" text-anchor="middle">does the board reach over these?</text>

  <line x1="30" y1="330" x2="830" y2="330" stroke="#dddddd"/>

  <text x="30" y="358" font-size="14" font-weight="bold" fill="#5b2d82">Side elevation, and why the answer decides the lab</text>

  <text x="40" y="384" font-size="12.5" font-weight="bold" fill="#111111">If the carrier board does overhang</text>
  <rect x="40" y="396" width="330" height="12" fill="#f7f9fb" stroke="#333333"/>
  <text x="46" y="406" font-size="9.5" fill="#555555">Raspberry Pi board</text>
  <g stroke="#1f4e79" stroke-width="2">
    <line x1="60" y1="396" x2="60" y2="366"/><line x1="72" y1="396" x2="72" y2="366"/>
    <line x1="84" y1="396" x2="84" y2="366"/><line x1="96" y1="396" x2="96" y2="366"/>
    <line x1="230" y1="396" x2="230" y2="366"/><line x1="242" y1="396" x2="242" y2="366"/>
    <line x1="254" y1="396" x2="254" y2="366"/><line x1="266" y1="396" x2="266" y2="366"/>
  </g>
  <rect x="52" y="362" width="110" height="34" fill="#ededed" stroke="#777777"/>
  <text x="107" y="383" font-size="10" fill="#333333" text-anchor="middle">26-pin socket</text>
  <rect x="40" y="350" width="330" height="12" fill="#f2e9f7" stroke="#7b4397"/>
  <text x="300" y="360" font-size="9.5" fill="#5b2d82" text-anchor="middle">LCD carrier board</text>
  <text x="248" y="414" font-size="10.5" fill="#c0392b">pins 27 to 40 sit under the board</text>
  <text x="40" y="432" font-size="11.5" fill="#333333">A Dupont shell needs far more height than the gap a socket of</text>
  <text x="40" y="448" font-size="11.5" fill="#333333">the usual size leaves. Both figures are generic header geometry,</text>
  <text x="40" y="464" font-size="11.5" fill="#333333">not this panel's documentation, so this is an argument and not</text>
  <text x="40" y="480" font-size="11.5" fill="#333333">a measurement.</text>
  <text x="40" y="504" font-size="12" font-weight="bold" fill="#c0392b">Then the 2x20 stacking header is the only route.</text>

  <text x="470" y="384" font-size="12.5" font-weight="bold" fill="#111111">If it stops at pin 26</text>
  <rect x="470" y="396" width="330" height="12" fill="#f7f9fb" stroke="#333333"/>
  <text x="476" y="406" font-size="9.5" fill="#555555">Raspberry Pi board</text>
  <g stroke="#1f4e79" stroke-width="2">
    <line x1="490" y1="396" x2="490" y2="366"/><line x1="502" y1="396" x2="502" y2="366"/>
    <line x1="514" y1="396" x2="514" y2="366"/><line x1="526" y1="396" x2="526" y2="366"/>
    <line x1="660" y1="396" x2="660" y2="366"/><line x1="672" y1="396" x2="672" y2="366"/>
    <line x1="684" y1="396" x2="684" y2="366"/><line x1="696" y1="396" x2="696" y2="366"/>
  </g>
  <rect x="482" y="362" width="110" height="34" fill="#ededed" stroke="#777777"/>
  <text x="537" y="383" font-size="10" fill="#333333" text-anchor="middle">26-pin socket</text>
  <rect x="470" y="350" width="150" height="12" fill="#f2e9f7" stroke="#7b4397"/>
  <text x="545" y="360" font-size="9.5" fill="#5b2d82" text-anchor="middle">LCD carrier board</text>
  <rect x="650" y="340" width="56" height="26" fill="#e6f4ea" stroke="#2e7d32" stroke-dasharray="3,2"/>
  <text x="678" y="356" font-size="9.5" fill="#2e7d32" text-anchor="middle">jumper</text>
  <text x="640" y="414" font-size="10.5" fill="#2e7d32">pins 27 to 40 reachable</text>
  <text x="470" y="432" font-size="11.5" fill="#333333">The sensor takes 3.3 V from the POW-BB rail that P15 labels,</text>
  <text x="470" y="448" font-size="11.5" fill="#333333">grounds to pin 30, 34 or 39, and runs on a bit-banged bus</text>
  <text x="470" y="464" font-size="11.5" fill="#333333">through the i2c-gpio overlay on two free GPIOs.</text>
  <text x="470" y="504" font-size="12" font-weight="bold" fill="#2e7d32">Then the lab costs nothing and needs no new part.</text>

  <line x1="30" y1="524" x2="830" y2="524" stroke="#dddddd"/>
  <text x="30" y="550" font-size="13" font-weight="bold" fill="#111111">What settles it, and why it is not settled here</text>
  <text x="30" y="572" font-size="12" fill="#333333">Lay a ruler along the long edge of the green carrier board, not the glass. About 85 mm means it overhangs.</text>
  <text x="30" y="592" font-size="12" fill="#333333">The inference that it does is drawn from a marketing sentence plus a dimension drawing of the glass panel, which is a</text>
  <text x="30" y="610" font-size="12" fill="#333333">different part. Two claims in this volume have already been withdrawn for resting on exactly that kind of reasoning.</text>
  <text x="30" y="630" font-size="11" fill="#666666">Sources in BOARDS.md, Part 8. Drawn for this volume; no vendor artwork is reproduced here.</text>
</svg>
