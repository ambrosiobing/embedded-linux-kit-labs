<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="860" height="640" fill="#ffffff"/>
  <text x="30" y="32" font-size="19" font-weight="bold" fill="#111111">P19's question, settled: the carrier covers pins 27 to 40</text>
  <text x="30" y="54" font-size="12.5" fill="#444444">Settled Thursday 8 October 2026 from the carrier schematic, not from a ruler. Everything drawn here is vendor-stated.</text>

  <text x="30" y="92" font-size="14" font-weight="bold" fill="#5b2d82">Plan view, looking down on the Raspberry Pi 3 Model B</text>

  <rect x="40" y="108" width="306" height="202" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/>
  <text x="193" y="302" font-size="11.5" fill="#555555" text-anchor="middle">Raspberry Pi 3 Model B, 85 mm x 56 mm</text>

  <rect x="66" y="120" width="183" height="18" fill="#cfe0f2" stroke="#1f4e79"/>
  <rect x="185" y="120" width="64" height="18" fill="#f6d9d4" stroke="#c0392b"/>
  <text x="125" y="133" font-size="10.5" fill="#111111" text-anchor="middle">pins 1 to 26</text>
  <text x="217" y="133" font-size="10.5" fill="#111111" text-anchor="middle">27 to 40</text>
  <text x="66" y="152" font-size="10.5" fill="#666666">40-pin header, 50.8 mm of 2.54 mm pitch</text>
  <text x="66" y="168" font-size="10.5" fill="#1f4e79">the socket mates these 26</text>
  <text x="185" y="184" font-size="10.5" fill="#c0392b">these 14 are covered</text>

  <rect x="40" y="108" width="306" height="202" fill="none" stroke="#7b4397" stroke-width="2.5"/>
  <text x="356" y="186" font-size="11.5" font-weight="bold" fill="#5b2d82">The carrier board outline is</text>
  <text x="356" y="204" font-size="11.5" font-weight="bold" fill="#5b2d82">85.06 x 56.21 mm.</text>
  <text x="356" y="228" font-size="11.5" fill="#333333">The same board outline as the Pi, so</text>
  <text x="356" y="246" font-size="11.5" fill="#333333">it runs the full length of the header</text>
  <text x="356" y="264" font-size="11.5" fill="#333333">and past it. Pin 1 of the socket is at</text>
  <text x="356" y="282" font-size="11.5" fill="#333333">the SD card and power end; pins 27</text>
  <text x="356" y="300" font-size="11.5" fill="#333333">to 40 are about 15 mm further on.</text>

  <line x1="30" y1="330" x2="830" y2="330" stroke="#dddddd"/>

  <text x="30" y="358" font-size="14" font-weight="bold" fill="#5b2d82">What the schematic shows, and why no ruler was needed</text>

  <rect x="40" y="372" width="330" height="118" fill="#fbfbfd" stroke="#7b4397"/>
  <text x="52" y="392" font-size="12" font-weight="bold" fill="#5b2d82">Connector symbol Pi_1</text>
  <g font-size="11" fill="#111111">
    <text x="52" y="412">1   2</text>
    <text x="52" y="428">3   4</text>
    <text x="52" y="444">...</text>
    <text x="52" y="460">25  26</text>
  </g>
  <text x="130" y="412" font-size="11.5" fill="#333333">thirteen rows of two,</text>
  <text x="130" y="430" font-size="11.5" fill="#333333">and it stops at 26</text>
  <text x="130" y="452" font-size="11.5" fill="#c0392b">pads PIH0Pi01 to PIH0Pi026</text>
  <text x="130" y="470" font-size="11.5" fill="#c0392b">in the netlist, none above</text>
  <text x="52" y="482" font-size="10.5" fill="#666666">Pins 27 to 40 are not contacts, and are not listed even as "not connected".</text>

  <text x="400" y="392" font-size="12" font-weight="bold" fill="#111111">Side elevation, with the panel seated</text>
  <rect x="400" y="440" width="330" height="12" fill="#f7f9fb" stroke="#333333"/>
  <text x="406" y="450" font-size="9.5" fill="#555555">Raspberry Pi board</text>
  <g stroke="#1f4e79" stroke-width="2">
    <line x1="420" y1="440" x2="420" y2="410"/><line x1="432" y1="440" x2="432" y2="410"/>
    <line x1="444" y1="440" x2="444" y2="410"/><line x1="456" y1="440" x2="456" y2="410"/>
  </g>
  <g stroke="#c0392b" stroke-width="2">
    <line x1="600" y1="440" x2="600" y2="410"/><line x1="612" y1="440" x2="612" y2="410"/>
    <line x1="624" y1="440" x2="624" y2="410"/><line x1="636" y1="440" x2="636" y2="410"/>
  </g>
  <rect x="412" y="406" width="110" height="34" fill="#ededed" stroke="#777777"/>
  <text x="467" y="427" font-size="10" fill="#333333" text-anchor="middle">26-pin socket</text>
  <rect x="400" y="394" width="330" height="12" fill="#f2e9f7" stroke="#7b4397" stroke-width="2"/>
  <text x="640" y="404" font-size="9.5" fill="#5b2d82" text-anchor="middle">carrier board, full length</text>
  <text x="560" y="464" font-size="10.5" fill="#c0392b">these are under the board</text>
  <text x="400" y="484" font-size="11.5" fill="#333333">No pass-through header. Nothing can be attached to the red pins.</text>

  <line x1="30" y1="504" x2="830" y2="504" stroke="#dddddd"/>
  <text x="30" y="530" font-size="13" font-weight="bold" fill="#c0392b">What follows for P19</text>
  <text x="30" y="552" font-size="12" fill="#333333">The bit-banged route is closed. It wanted an i2c-gpio bus on two free GPIOs above pin 26, and a seated panel leaves none</text>
  <text x="30" y="570" font-size="12" fill="#333333">reachable. P19 needs a 2x20 stacking header, or a tall header whose pins 27 to 40 clear the 26-pin socket. One small part,</text>
  <text x="30" y="588" font-size="12" fill="#333333">and this bin does not contain it. The lab is no longer blocked on an unknown; it is blocked on a purchase it can name.</text>
  <text x="30" y="612" font-size="11.5" fill="#5b2d82">The earlier inference pointed at this same answer and was still refused, because it rested on a marketing sentence and a</text>
  <text x="30" y="630" font-size="11.5" fill="#5b2d82">drawing of the glass panel. Being right by luck is not being right. Sources in BOARDS.md, Part 8. No vendor artwork here.</text>
</svg>
