<svg xmlns="http://www.w3.org/2000/svg" width="860" height="760" viewBox="0 0 860 760" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="860" height="760" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="bold" fill="#111111">The Raspberry Pi 40-pin header: who claims what</text>
  <text x="30" y="56" font-size="12.5" fill="#444444">Drawn for this volume. Every claim is sourced in BOARDS.md; nothing here is copied from a vendor document.</text>

  <g font-size="11.5">
    <rect x="30" y="72" width="14" height="14" fill="#fdecea" stroke="#c0392b"/><text x="50" y="84" fill="#333333">power</text>
    <rect x="105" y="72" width="14" height="14" fill="#ededed" stroke="#777777"/><text x="125" y="84" fill="#333333">ground</text>
    <rect x="180" y="72" width="14" height="14" fill="#e4edf7" stroke="#1f4e79"/><text x="200" y="84" fill="#333333">bus: I2C, UART, SPI0, ID EEPROM</text>
    <rect x="395" y="72" width="14" height="14" fill="#fdf0d5" stroke="#b7791f"/><text x="415" y="84" fill="#333333">claimed by a specific board</text>
    <rect x="590" y="72" width="14" height="14" fill="#ffffff" stroke="#e07b39" stroke-dasharray="3,2"/><text x="610" y="84" fill="#333333">disputed, see Part 7a</text>
    <rect x="745" y="72" width="14" height="14" fill="#e6f4ea" stroke="#2e7d32"/><text x="765" y="84" fill="#333333">indicators</text>
  </g>

  <text x="30" y="112" font-size="12" fill="#666666">odd pins</text>
  <text x="790" y="112" font-size="12" fill="#666666" text-anchor="end">even pins</text>

  <g font-size="11.5">
    <rect x="18" y="122" width="12" height="340" fill="#f2e9f7" stroke="#7b4397"/>
    <text x="24" y="300" fill="#5b2d82" font-size="11" transform="rotate(-90 24 300)" text-anchor="middle">3.5 inch LCD (A) covers pins 1 to 26</text>
  </g>

  <g id="rows" font-size="11.5">
    <g><rect x="40" y="122" width="232" height="22" fill="#fdecea" stroke="#c0392b"/><text x="264" y="137" text-anchor="end" fill="#111111">3V3</text><rect x="278" y="122" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="137" text-anchor="middle" fill="#111111">1</text><rect x="318" y="122" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="137" text-anchor="middle" fill="#111111">2</text><rect x="358" y="122" width="232" height="22" fill="#fdecea" stroke="#c0392b"/><text x="366" y="137" fill="#111111">5V</text></g>
    <g><rect x="40" y="148" width="232" height="22" fill="#e4edf7" stroke="#1f4e79"/><text x="264" y="163" text-anchor="end" fill="#111111">GPIO2, SDA1</text><rect x="278" y="148" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="163" text-anchor="middle" fill="#111111">3</text><rect x="318" y="148" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="163" text-anchor="middle" fill="#111111">4</text><rect x="358" y="148" width="232" height="22" fill="#fdecea" stroke="#c0392b"/><text x="366" y="163" fill="#111111">5V</text></g>
    <g><rect x="40" y="174" width="232" height="22" fill="#e4edf7" stroke="#1f4e79"/><text x="264" y="189" text-anchor="end" fill="#111111">GPIO3, SCL1</text><rect x="278" y="174" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="189" text-anchor="middle" fill="#111111">5</text><rect x="318" y="174" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="189" text-anchor="middle" fill="#111111">6</text><rect x="358" y="174" width="232" height="22" fill="#ededed" stroke="#777777"/><text x="366" y="189" fill="#111111">GND</text></g>
    <g><rect x="40" y="200" width="232" height="22" fill="#fdf0d5" stroke="#b7791f"/><text x="264" y="215" text-anchor="end" fill="#111111">GPIO4: PWRKEY and FLIGHTMODE</text><rect x="278" y="200" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="215" text-anchor="middle" fill="#111111">7</text><rect x="318" y="200" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="215" text-anchor="middle" fill="#111111">8</text><rect x="358" y="200" width="232" height="22" fill="#e4edf7" stroke="#1f4e79"/><text x="366" y="215" fill="#111111">GPIO14, TXD0: all three modems</text></g>
    <g><rect x="40" y="226" width="232" height="22" fill="#ededed" stroke="#777777"/><text x="264" y="241" text-anchor="end" fill="#111111">GND</text><rect x="278" y="226" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="241" text-anchor="middle" fill="#111111">9</text><rect x="318" y="226" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="241" text-anchor="middle" fill="#111111">10</text><rect x="358" y="226" width="232" height="22" fill="#e4edf7" stroke="#1f4e79"/><text x="366" y="241" fill="#111111">GPIO15, RXD0: all three modems</text></g>
    <g><rect x="40" y="252" width="232" height="22" fill="#ffffff" stroke="#cccccc"/><text x="264" y="267" text-anchor="end" fill="#111111">GPIO17</text><rect x="278" y="252" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="267" text-anchor="middle" fill="#111111">11</text><rect x="318" y="252" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="267" text-anchor="middle" fill="#111111">12</text><rect x="358" y="252" width="232" height="22" fill="#ffffff" stroke="#cccccc"/><text x="366" y="267" fill="#111111">GPIO18</text></g>
    <g><rect x="40" y="278" width="232" height="22" fill="#ffffff" stroke="#e07b39" stroke-dasharray="3,2"/><text x="264" y="293" text-anchor="end" fill="#111111">GPIO27: RI on 7600? disputed</text><rect x="278" y="278" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="293" text-anchor="middle" fill="#111111">13</text><rect x="318" y="278" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="293" text-anchor="middle" fill="#111111">14</text><rect x="358" y="278" width="232" height="22" fill="#ededed" stroke="#777777"/><text x="366" y="293" fill="#111111">GND</text></g>
    <g><rect x="40" y="304" width="232" height="22" fill="#ffffff" stroke="#e07b39" stroke-dasharray="3,2"/><text x="264" y="319" text-anchor="end" fill="#111111">GPIO22: DTR on 7600? disputed</text><rect x="278" y="304" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="319" text-anchor="middle" fill="#111111">15</text><rect x="318" y="304" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="319" text-anchor="middle" fill="#111111">16</text><rect x="358" y="304" width="232" height="22" fill="#ffffff" stroke="#e07b39" stroke-dasharray="3,2"/><text x="366" y="319" fill="#111111">GPIO23: CTS on 7600? disputed</text></g>
    <g><rect x="40" y="330" width="232" height="22" fill="#fdecea" stroke="#c0392b"/><text x="264" y="345" text-anchor="end" fill="#111111">3V3</text><rect x="278" y="330" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="345" text-anchor="middle" fill="#111111">17</text><rect x="318" y="330" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="345" text-anchor="middle" fill="#111111">18</text><rect x="358" y="330" width="232" height="22" fill="#ffffff" stroke="#cccccc"/><text x="366" y="345" fill="#111111">GPIO24</text></g>
    <g><rect x="40" y="356" width="232" height="22" fill="#e4edf7" stroke="#1f4e79"/><text x="264" y="371" text-anchor="end" fill="#111111">GPIO10, MOSI</text><rect x="278" y="356" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="371" text-anchor="middle" fill="#111111">19</text><rect x="318" y="356" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="371" text-anchor="middle" fill="#111111">20</text><rect x="358" y="356" width="232" height="22" fill="#ededed" stroke="#777777"/><text x="366" y="371" fill="#111111">GND</text></g>
    <g><rect x="40" y="382" width="232" height="22" fill="#e4edf7" stroke="#1f4e79"/><text x="264" y="397" text-anchor="end" fill="#111111">GPIO9, MISO</text><rect x="278" y="382" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="397" text-anchor="middle" fill="#111111">21</text><rect x="318" y="382" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="397" text-anchor="middle" fill="#111111">22</text><rect x="358" y="382" width="232" height="22" fill="#ffffff" stroke="#cccccc"/><text x="366" y="397" fill="#111111">GPIO25</text></g>
    <g><rect x="40" y="408" width="232" height="22" fill="#e4edf7" stroke="#1f4e79"/><text x="264" y="423" text-anchor="end" fill="#111111">GPIO11, SCLK</text><rect x="278" y="408" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="423" text-anchor="middle" fill="#111111">23</text><rect x="318" y="408" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="423" text-anchor="middle" fill="#111111">24</text><rect x="358" y="408" width="232" height="22" fill="#e4edf7" stroke="#1f4e79"/><text x="366" y="423" fill="#111111">GPIO8, CE0: the MCC 118's chip select</text></g>
    <g><rect x="40" y="434" width="232" height="22" fill="#ededed" stroke="#777777"/><text x="264" y="449" text-anchor="end" fill="#111111">GND</text><rect x="278" y="434" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="449" text-anchor="middle" fill="#111111">25</text><rect x="318" y="434" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="449" text-anchor="middle" fill="#111111">26</text><rect x="358" y="434" width="232" height="22" fill="#e4edf7" stroke="#1f4e79"/><text x="366" y="449" fill="#111111">GPIO7, CE1</text></g>
    <g><rect x="40" y="460" width="232" height="22" fill="#e4edf7" stroke="#1f4e79"/><text x="264" y="475" text-anchor="end" fill="#111111">ID_SD: HAT ID EEPROM</text><rect x="278" y="460" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="475" text-anchor="middle" fill="#111111">27</text><rect x="318" y="460" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="475" text-anchor="middle" fill="#111111">28</text><rect x="358" y="460" width="232" height="22" fill="#e4edf7" stroke="#1f4e79"/><text x="366" y="475" fill="#111111">ID_SC: HAT ID EEPROM</text></g>
    <g><rect x="40" y="486" width="232" height="22" fill="#ffffff" stroke="#cccccc"/><text x="264" y="501" text-anchor="end" fill="#111111">GPIO5</text><rect x="278" y="486" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="501" text-anchor="middle" fill="#111111">29</text><rect x="318" y="486" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="501" text-anchor="middle" fill="#111111">30</text><rect x="358" y="486" width="232" height="22" fill="#ededed" stroke="#777777"/><text x="366" y="501" fill="#111111">GND</text></g>
    <g><rect x="40" y="512" width="232" height="22" fill="#fdf0d5" stroke="#b7791f"/><text x="264" y="527" text-anchor="end" fill="#111111">GPIO6: PWR, powers up the SIM7600</text><rect x="278" y="512" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="527" text-anchor="middle" fill="#111111">31</text><rect x="318" y="512" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="527" text-anchor="middle" fill="#111111">32</text><rect x="358" y="512" width="232" height="22" fill="#fdf0d5" stroke="#b7791f"/><text x="366" y="527" fill="#111111">GPIO12: MCC 118 board address</text></g>
    <g><rect x="40" y="538" width="232" height="22" fill="#fdf0d5" stroke="#b7791f"/><text x="264" y="553" text-anchor="end" fill="#111111">GPIO13: MCC 118 board address</text><rect x="278" y="538" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="553" text-anchor="middle" fill="#111111">33</text><rect x="318" y="538" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="553" text-anchor="middle" fill="#111111">34</text><rect x="358" y="538" width="232" height="22" fill="#ededed" stroke="#777777"/><text x="366" y="553" fill="#111111">GND: indicator return</text></g>
    <g><rect x="40" y="564" width="232" height="22" fill="#ffffff" stroke="#cccccc"/><text x="264" y="579" text-anchor="end" fill="#111111">GPIO19</text><rect x="278" y="564" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="579" text-anchor="middle" fill="#111111">35</text><rect x="318" y="564" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="579" text-anchor="middle" fill="#111111">36</text><rect x="358" y="564" width="232" height="22" fill="#e6f4ea" stroke="#2e7d32"/><text x="366" y="579" fill="#111111">GPIO16: indicator, four cellular labs</text></g>
    <g><rect x="40" y="590" width="232" height="22" fill="#fdf0d5" stroke="#b7791f"/><text x="264" y="605" text-anchor="end" fill="#111111">GPIO26: MCC 118 address, 7070G DTR</text><rect x="278" y="590" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="605" text-anchor="middle" fill="#111111">37</text><rect x="318" y="590" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="605" text-anchor="middle" fill="#111111">38</text><rect x="358" y="590" width="232" height="22" fill="#e6f4ea" stroke="#2e7d32"/><text x="366" y="605" fill="#111111">GPIO20: indicator</text></g>
    <g><rect x="40" y="616" width="232" height="22" fill="#ededed" stroke="#777777"/><text x="264" y="631" text-anchor="end" fill="#111111">GND: indicator return</text><rect x="278" y="616" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="295" y="631" text-anchor="middle" fill="#111111">39</text><rect x="318" y="616" width="34" height="22" fill="#fafafa" stroke="#999999"/><text x="335" y="631" text-anchor="middle" fill="#111111">40</text><rect x="358" y="616" width="232" height="22" fill="#e6f4ea" stroke="#2e7d32"/><text x="366" y="631" fill="#111111">GPIO21: indicator</text></g>
  </g>

  <g font-size="12">
    <text x="620" y="140" fill="#5b2d82" font-weight="bold">Why the indicators sit at the bottom</text>
    <text x="620" y="160" fill="#333333">Pins 13, 15 and 16 were the draft's choice.</text>
    <text x="620" y="178" fill="#333333">They are the three dashed boxes.</text>
    <text x="620" y="204" fill="#333333">Pin 37, GPIO26, was the second choice,</text>
    <text x="620" y="222" fill="#333333">and two boards claim it.</text>
    <text x="620" y="248" fill="#333333">Pins 36, 38 and 40 are claimed by</text>
    <text x="620" y="266" fill="#333333">nothing in this bin, with grounds</text>
    <text x="620" y="284" fill="#333333">next door on 34 and 39.</text>
    <text x="620" y="320" fill="#5b2d82" font-weight="bold">Why P19 is blocked</text>
    <text x="620" y="340" fill="#333333">The panel covers pins 1 to 26, and</text>
    <text x="620" y="358" fill="#333333">both 3.3 V pins, 1 and 17, are inside</text>
    <text x="620" y="376" fill="#333333">that range. So is the whole I2C corner.</text>
    <text x="620" y="402" fill="#5b2d82" font-weight="bold">Why one HAT at a time</text>
    <text x="620" y="422" fill="#333333">SPI0 on pins 19 to 26 is wanted by the</text>
    <text x="620" y="440" fill="#333333">MCC 118, the LCD and the Explorer700,</text>
    <text x="620" y="458" fill="#333333">and the ID EEPROM on 27 and 28 is</text>
    <text x="620" y="476" fill="#333333">claimed whatever is seated.</text>
  </g>

  <text x="30" y="672" font-size="11.5" fill="#666666">Sources for every claim above are listed in BOARDS.md, Part 8. Dashed boxes are the SIM7600E-H lines its own manual's Table 1 does not list.</text>
  <text x="30" y="692" font-size="11.5" fill="#666666">Pin functions follow the volume's appendix. Confirm against the pinout of the board in front of you: these are facts about HATs, not about the Raspberry Pi.</text>
</svg>
