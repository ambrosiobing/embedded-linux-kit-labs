name: checks

# What this job can and cannot see.
#
# The authoring sources are not published. There is no sections/ and no
# figures/*.tex in a clone, so the four checks that read them cannot run here:
# the house rules, the command-block parser, the per-lab figure check, and the
# regeneration check. They run in prepublish.py on the authoring machine
# instead, and this job gained a guard that the sources stay unpublished.
#
# What remains here is everything that reads only what is published: the parts
# file and its suite, the status ladder, the publishing guards, and the two
# labs that ship a C program. This job is still where that C is compiled for
# the first time, because the authoring laptop has no compiler it may use.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The bill of materials still refuses the pairings the book rejects
        # Checking a correct file proves nothing. This breaks it seven ways,
        # five of them taken from the front matter's own list of errors found
        # in the 198-page blueprint, and fails if the checker stays quiet.
        run: python tests/test_inventory.py

      - name: No authoring source is published
        # The sources moved off the published tree deliberately: a reader takes
        # one Markdown chapter, not a book, and .tex shows raw markup. The four
        # checks that used to read sections/ now run in prepublish.py on the
        # authoring machine, because they cannot run here any more. What this
        # job can still do is make sure the rule holds.
        run: |
          set -e
          if git ls-files | grep -E '\.tex$'; then
            echo "A .tex file is committed, and the authoring sources are never published."
            echo "Only the Markdown edition and its SVG figures are. The sources stay on"
            echo "the authoring machine, and prepublish.py runs the checks that need them."
            exit 1
          fi
          echo "no .tex in the published tree, as intended"

      - name: Every lab has a state, and only the four states exist
        # A status page is worth having only if it cannot drift. This refuses a
        # lab with no row, and a row whose state is a word the ladder does not
        # define, which is how such a page usually rots: a twenty-first state
        # invented in passing to avoid admitting one of the four.
        run: |
          set -e
          fail=0
          for n in $(seq -w 1 20); do
            row=$(grep -E "^\| P${n} \|" STATUS.md || true)
            if [ -z "$row" ]; then
              echo "STATUS.md: no row for P${n}"
              fail=1
              continue
            fi
            state=$(printf '%s\n' "$row" | awk -F'|' '{print $3}' | tr -d ' *')
            case "$state" in
              written|checked|run|passed) ;;
              *) echo "P${n}: state '${state}' is not one of written, checked, run, passed"; fail=1 ;;
            esac
          done
          exit $fail

      - name: P04 builds, with the warnings as errors
        run: |
          set -e
          cc --version | head -1
          make -C p04 all

      - name: P04's suite, with no hardware anywhere
        # The grep is not decoration. make exits zero and prints "Nothing to
        # be done" when a target has no recipe, so a Makefile missing its
        # check rule reports a green suite that never ran. That happened on
        # Friday 16 October 2026 to two labs at once. The summary line can
        # only come from a suite that executed.
        run: |
          set -e
          make -C p04 check | tee p04-suite.txt
          grep -qE "[0-9]+ checks, 0 failed" p04-suite.txt || {
            echo "p04: no suite summary in that output, so nothing ran"
            exit 1
          }

      - name: P04's stricter conversion pass, reported but not gating
        continue-on-error: true
        run: make -C p04 strict

      - name: P04's command flow, end to end
        run: |
          set -e
          cd p04
          ./p04 synth --kind idle   --blocks 6 --out idle.p04
          ./p04 synth --kind touch  --blocks 6 --out touch.p04
          ./p04 synth --kind speech --blocks 6 --out speech.p04
          ./p04 baseline --source idle.p04 --out book.lab \
              --mounting "continuous integration" \
              --warn 1.5 --fault 3.0 --band-low 2000 --band-high 6000
          ./p04 analyse --source touch.p04  --book book.lab | tee touch.txt
          ./p04 analyse --source speech.p04 --book book.lab | tee speech.txt
          ./p04 replay  --source touch.p04  --book book.lab
          grep -q "WARNING\|FAULT" touch.txt || { echo "a case touch should not read NORMAL"; exit 1; }
          grep -q "^NORMAL" speech.txt         || { echo "a voice should read NORMAL"; exit 1; }
          ./p04 synth --kind idle --blocks 8 --drop 3,4 --out holed.p04
          if ./p04 transport --source holed.p04; then
            echo "transport reported success on a stream with holes in it"
            exit 1
          fi
          echo "the orthogonality demonstration holds and a holed stream is refused"

      - name: A frequency axis that is wrong is refused, not reported
        run: |
          set -e
          cd p04
          ./p04 synth --kind idle --blocks 10 --out honest.p04
          ./p04 baseline --source honest.p04 --out axis.lab \
              --mounting "continuous integration" \
              --warn 1.5 --fault 3.0 --band-low 2000 --band-high 6000
          ./p04 validate --source honest.p04 --book axis.lab
          ./p04 synth --kind idle --blocks 10 --rate 30000 --out skewed.p04
          if ./p04 analyse --source skewed.p04 --book axis.lab; then
            echo "a lab book taken at one rate was applied to a capture taken at another"
            exit 1
          fi
          echo "the rate check and the resting invariant both hold"

      - name: P18 builds, with the warnings as errors
        run: make -C p18 all

      - name: P18's suite, with no hardware anywhere
        # The grep is not decoration. make exits zero and prints "Nothing to
        # be done" when a target has no recipe, so a Makefile missing its
        # check rule reports a green suite that never ran. That happened on
        # Friday 16 October 2026 to two labs at once. The summary line can
        # only come from a suite that executed.
        run: |
          set -e
          make -C p18 check | tee p18-suite.txt
          grep -qE "[0-9]+ checks, 0 failed" p18-suite.txt || {
            echo "p18: no suite summary in that output, so nothing ran"
            exit 1
          }

      - name: P18's stricter conversion pass, reported but not gating
        # Marked the same way as P04's, and with the same warning attached to
        # it: a step allowed to continue is recorded as a success when it
        # fails, so reading its output is a thing someone has to choose to do.
        continue-on-error: true
        run: make -C p18 strict

      - name: P18's two faults stay two, end to end
        # Loss and rate are different faults with different causes. This runs
        # a clean stream and a stream missing five samples in two thousand
        # through the same commands, and fails if the acceptance test cannot
        # tell them apart.
        run: |
          set -e
          cd p18
          ./p18 synth --samples 2000 --out clean.stream
          ./p18 sink --source clean.stream --out clean.capture \
              --report clean.p18 --seconds 0 --rate 1000
          ./p18 verify --report clean.p18 --allow-unmeasured-rate
          ./p18 synth --samples 2000 --drop 10,11,12,13,14 --out holed.stream
          ./p18 sink --source holed.stream --report holed.p18 \
              --seconds 0 --rate 1000
          if ./p18 verify --report holed.p18 --allow-unmeasured-rate; then
            echo "a capture missing five samples in two thousand was accepted"
            exit 1
          fi
          ./p18 count --source clean.capture | tee clean.txt
          grep -q "gaps 0" clean.txt || { echo "a clean capture reported gaps"; exit 1; }
          echo "the acceptance test passes a clean stream and refuses a holed one"

      - name: A rate that was never measured does not pass as one
        # The capture above was read from a file in milliseconds. Samples
        # divided by that time describes this program, not a probe, and the
        # default is to refuse it rather than to report it.
        run: |
          set -e
          cd p18
          if ./p18 verify --report clean.p18; then
            echo "a run whose rate was never measured passed the rate check"
            exit 1
          fi
          echo "an unmeasured rate is not a rate that passed"

      - name: A line too long for the buffer costs one sample and invents none
        run: |
          set -e
          cd p18
          ./p18 synth --samples 20 --long 7 --out long.stream
          ./p18 count --source long.stream | tee long.txt
          grep -q "1 over-long" long.txt || { echo "the over-long line was not counted"; exit 1; }
          grep -q "samples 19" long.txt || { echo "the over-long line became a sample"; exit 1; }
          echo "the over-long line was refused whole, not split into two samples"

      - name: P06 builds, with the warnings as errors
        run: make -C p06 all

      - name: P06's suite, with no hardware anywhere
        # The grep is not decoration. make exits zero and prints "Nothing to
        # be done" when a target has no recipe, so a Makefile missing its
        # check rule reports a green suite that never ran. That happened on
        # Friday 16 October 2026 to two labs at once. The summary line can
        # only come from a suite that executed.
        run: |
          set -e
          make -C p06 check | tee p06-suite.txt
          grep -qE "[0-9]+ checks, 0 failed" p06-suite.txt || {
            echo "p06: no suite summary in that output, so nothing ran"
            exit 1
          }

      - name: P06's stricter conversion pass, reported but not gating
        continue-on-error: true
        run: make -C p06 strict

      - name: P06 measures a threshold and refuses to invent one
        # The chapter says to measure the threshold rather than guess it. The
        # only way a program holds anyone to that is by refusing to produce
        # one from a measurement that does not deserve the name, so both
        # refusals are exercised here beside the case that works.
        run: |
          set -e
          cd p06
          ./p06 synth --frames 30 --scene empty --out empty.stream
          ./p06 baseline --source empty.stream --out bench.book \
              --placement "continuous integration, no sensor" | tee base.txt
          grep -q "threshold" base.txt || { echo "no threshold was produced"; exit 1; }
          ./p06 synth --frames 5 --scene empty --out short.stream
          if ./p06 baseline --source short.stream --out short.book; then
            echo "five frames was accepted as a baseline"
            exit 1
          fi
          ./p06 synth --frames 30 --scene walk --hand-zones 6 --out moving.stream
          if ./p06 baseline --source moving.stream --out moving.book; then
            echo "a wall with a hand moving across it was accepted as a baseline"
            exit 1
          fi
          echo "a steady wall gives a threshold, and neither of the other two does"

      - name: P06 tells a hand from an empty field, and paints only what it parsed
        run: |
          set -e
          cd p06
          ./p06 synth --frames 30 --scene hand --hand-zones 6 --out hand.stream
          ./p06 run --source hand.stream --book bench.book --expect-zones 4:10
          ./p06 run --source empty.stream --book bench.book --expect-zones 0:0
          ./p06 synth --frames 12 --scene hand --out mixed.stream \
              --fault short:2 --fault notz:3 --fault rubbish:4 \
              --fault huge:5 --fault long:6
          ./p06 run --source mixed.stream --book bench.book | tee mixed.txt
          grep -q "7 accepted, 0 painted" mixed.txt \
            || { echo "the five bad lines were not all dropped"; exit 1; }
          grep -q "1 not a Z line" mixed.txt \
            || { echo "the line from another talker was not counted as one"; exit 1; }
          grep -q "1 over-long" mixed.txt \
            || { echo "the over-long line reached the parser"; exit 1; }
          echo "the hand is 6 zones, an empty field is 0, and 5 bad lines are 5 drops"

      - name: P02 builds, with the warnings as errors
        run: make -C p02 all

      - name: P02's suite, with no hardware anywhere
        # The grep is not decoration. make exits zero and prints "Nothing to
        # be done" when a target has no recipe, so a Makefile missing its
        # check rule reports a green suite that never ran. That happened on
        # Friday 16 October 2026 to two labs at once. The summary line can
        # only come from a suite that executed.
        run: |
          set -e
          make -C p02 check | tee p02-suite.txt
          grep -qE "[0-9]+ checks, 0 failed" p02-suite.txt || {
            echo "p02: no suite summary in that output, so nothing ran"
            exit 1
          }

      - name: P02's stricter conversion pass, reported but not gating
        continue-on-error: true
        run: make -C p02 strict

      - name: P03 builds, with the warnings as errors
        run: make -C p03 all

      - name: P03's suite, with no hardware anywhere
        # The grep is not decoration. make exits zero and prints "Nothing to
        # be done" when a target has no recipe, so a Makefile missing its
        # check rule reports a green suite that never ran. That happened on
        # Friday 16 October 2026 to two labs at once. The summary line can
        # only come from a suite that executed.
        run: |
          set -e
          make -C p03 check | tee p03-suite.txt
          grep -qE "[0-9]+ checks, 0 failed" p03-suite.txt || {
            echo "p03: no suite summary in that output, so nothing ran"
            exit 1
          }

      - name: P03's stricter conversion pass, reported but not gating
        continue-on-error: true
        run: make -C p03 strict

      - name: P02 reads the two timer bitmaps with their own tables
        # The same eight characters mean three hours in one table and fifty
        # minutes in the other, and a host that never decodes them cannot
        # tell. This is the arithmetic the lab rests on.
        run: |
          set -e
          cd p02
          ./p02 timers --tau 00100011 --active 00000101 | tee timers.txt
          grep -q "10800 s" timers.txt || { echo "the update interval is not three hours"; exit 1; }
          grep -q "10 s" timers.txt    || { echo "the active time is not ten seconds"; exit 1; }
          ./p02 plan --period 600 | tee plan.txt
          grep -q "6.00 datagrams" plan.txt || { echo "ten minutes is not six an hour"; exit 1; }
          if ./p02 plan --period 5; then
            echo "a schedule that never lets the radio sleep was accepted"
            exit 1
          fi
          echo "the bitmaps decode, and a schedule with no sleep in it is refused"

      - name: P02 drives four scenes, and the indicator follows registration
        run: |
          set -e
          cd p02
          ./p02 transcript --scene attached --out attached.transcript
          ./p02 session --transcript attached.transcript | tee attached.txt
          grep -q "indicator on for 3 of 3" attached.txt \
            || { echo "the indicator did not follow a good registration"; exit 1; }
          ./p02 transcript --scene searching --out searching.transcript
          ./p02 session --transcript searching.transcript | tee searching.txt
          grep -q "sends attempted 0" searching.txt \
            || { echo "something was sent into a network that had not answered"; exit 1; }
          ./p02 transcript --scene silent --out silent.transcript
          if ./p02 session --transcript silent.transcript; then
            echo "a module that said nothing was treated as a module that answered"
            exit 1
          fi
          echo "attached sends three, searching sends none, silence stops the lab"

      - name: P03 keeps the receiver down while the radio transmits
        # The lab's whole claim. Enforced inside the program, and audited
        # from outside it, because the enforcement protects this program and
        # a session typed by hand in minicom has no such function in it.
        run: |
          set -e
          cd p03
          ./p03 transcript --scene fix --out fix.transcript
          ./p03 session --transcript fix.transcript --log session.log | tee fix.txt
          grep -q "ordering refusals 0" fix.txt || { echo "something was refused"; exit 1; }
          ./p03 audit --transcript session.log
          ./p03 transcript --scene gnss-left-on --out broken.transcript
          if ./p03 audit --transcript broken.transcript; then
            echo "a recording that transmitted with the receiver powered was passed"
            exit 1
          fi
          echo "the audit passes a good recording and refuses a bad one"

      - name: P03 refuses the wrong bearer and never invents a stamp
        run: |
          set -e
          cd p03
          ./p03 transcript --scene wrong-bearer --out bearer.transcript
          if ./p03 session --transcript bearer.transcript; then
            echo "a payload would have gone out over a bearer this lab forbids"
            exit 1
          fi
          ./p03 transcript --scene no-fix --out nofix.transcript
          ./p03 session --transcript nofix.transcript | tee nofix.txt
          grep -q "published 0, skipped 3" nofix.txt \
            || { echo "a cycle with no fix published something anyway"; exit 1; }
          echo "the wrong bearer stops the lab, and a cycle with no fix publishes nothing"

      - name: P13 builds, with the warnings as errors
        run: make -C p13 all

      - name: P13's suite, with no hardware anywhere
        run: |
          set -e
          make -C p13 check | tee p13-suite.txt
          grep -qE "[0-9]+ checks, 0 failed" p13-suite.txt || {
            echo "p13: no suite summary in that output, so nothing ran"
            exit 1
          }

      - name: P13's stricter conversion pass, reported but not gating
        continue-on-error: true
        run: make -C p13 strict

      - name: P13 refuses four runs that do not show the antenna test
        # The one that matters is the healthy run. A log of a bench where
        # everything worked demonstrates nothing about what happens when an
        # antenna comes off, and a gate that cannot say so is a summary.
        run: |
          set -e
          cd p13
          ./p13 scene --kind outage --out outage.p13
          ./p13 verify --source outage.p13 | tee outage.txt
          grep -q "rhythm    pass" outage.txt \
            || { echo "the backup rhythm was not judged"; exit 1; }
          for kind in steady short-gap no-return backup-only; do
            ./p13 scene --kind $kind --out $kind.p13
            if ./p13 verify --source $kind.p13 > $kind.txt; then
              echo "the $kind run was accepted as a failover demonstration"
              exit 1
            fi
          done
          grep -q "never fell" steady.txt \
            || { echo "a healthy run was refused for the wrong reason"; exit 1; }
          echo "one run passes and four are refused, each for its own reason"

      - name: P13's window is the window, judged against the wrong one
        run: |
          set -e
          cd p13
          if ./p13 verify --source outage.p13 --window 10; then
            echo "a 45 second run passed as though its window were 10"
            exit 1
          fi
          echo "a log judged against the wrong window is refused"

      - name: P05 builds, with the warnings as errors
        run: make -C p05 all

      - name: P05's suite, with no hardware anywhere
        run: |
          set -e
          make -C p05 check | tee p05-suite.txt
          grep -qE "[0-9]+ checks, 0 failed" p05-suite.txt || {
            echo "p05: no suite summary in that output, so nothing ran"
            exit 1
          }

      - name: P05's stricter conversion pass, reported but not gating
        continue-on-error: true
        run: make -C p05 strict

      - name: P05 catches what a row count does not
        run: |
          set -e
          cd p05
          ./p05 scene --kind good --out good.csv
          ./p05 check --source good.csv
          ./p05 scene --kind repeat --out repeat.csv
          ./p05 check --source repeat.csv > repeat.txt && {
            echo "a file with an index written twice was called whole"
            exit 1
          }
          grep -q "10001 rows" repeat.txt \
            || { echo "that file does not have more rows than a whole one"; exit 1; }
          ./p05 scene --kind hole --out hole.csv
          ./p05 check --source hole.csv > hole.txt && {
            echo "a file with seven samples missing was called whole"
            exit 1
          }
          grep -q "holes 7" hole.txt || { echo "the holes were not counted"; exit 1; }
          echo "a repeat, a hole, and a row count that would have missed both"

      - name: P05 stops one item short, and says which item
        # The lab's own conclusion, as an exit status. Seven items pass, the
        # eighth needs an instrument this bench does not have, and that is
        # neither a pass nor a failure. Exit 3 is the difference.
        run: |
          set -e
          cd p05
          ./p05 book --out bench.p05book --address 0 --header-clear \
              --survived-reboot --second-run-clean --date "continuous integration"
          set +e
          ./p05 verify --source good.csv --book bench.p05book > verdict.txt
          rc=$?
          set -e
          cat verdict.txt
          [ "$rc" -eq 3 ] || { echo "expected exit 3, got $rc"; exit 1; }
          grep -q "no voltmeter in" verdict.txt \
            || { echo "the verdict did not name what is missing"; exit 1; }
          # The same capture with one instrument reading added passes outright.
          ./p05 book --out full.p05book --address 0 --header-clear \
              --survived-reboot --second-run-clean --rail-3v3 3.2988 \
              --instrument "a cheap multimeter" --date "continuous integration"
          ./p05 verify --source good.csv --book full.p05book
          echo "one purchase is the whole difference between those two runs"

      - name: P01 builds, with the warnings as errors
        # P09 runs this same program with one argument changed, so this step
        # compiles both labs' publishers. The live read is Linux only and is
        # compiled here, where there is no bus to answer it.
        run: make -C p01 all

      - name: P01's suite, with no hardware anywhere
        run: |
          set -e
          make -C p01 check | tee p01-suite.txt
          grep -qE "[0-9]+ checks, 0 failed" p01-suite.txt || {
            echo "p01: no suite summary in that output, so nothing ran"
            exit 1
          }

      - name: P01's stricter conversion pass, reported but not gating
        continue-on-error: true
        run: make -C p01 strict

      - name: P01 decides on the magnitude, not on an axis
        # The lab's own rule, as two runs that must produce nothing and one
        # that must produce five. A threshold on a single axis gets the first
        # of these wrong in one direction and free fall wrong in the other.
        run: |
          set -e
          cd p01
          ./p01 scene --kind rest --out rest.samples
          ./p01 replay --source rest.samples | tee rest.txt
          grep -q "200 samples decoded" rest.txt \
            || { echo "the still bench was not read"; exit 1; }
          grep -q "0 samples past the dead band, 0 published" rest.txt \
            || { echo "a still bench published something"; exit 1; }
          ./p01 scene --kind on-its-side --out side.samples
          ./p01 replay --source side.samples | tee side.txt
          grep -q "0 samples past the dead band, 0 published" side.txt \
            || { echo "a sensor on its side read as an event"; exit 1; }
          ./p01 scene --kind free-fall --out fall.samples
          ./p01 replay --source fall.samples | tee fall.txt
          grep -q "200 samples past the dead band, 5 published" fall.txt \
            || { echo "free fall was not noticed, or was not rate limited"; exit 1; }
          ./p01 scene --kind ringing --out ring.samples
          ./p01 replay --source ring.samples | tee ring.txt
          grep -q "200 samples past the dead band, 5 published" ring.txt \
            || { echo "the cool-off did not hold a ringing table to five"; exit 1; }
          echo "quiet when nothing happened, five publishes when it did"

      - name: P01 reads the sign, and P09 gets the budget
        run: |
          set -e
          cd p01
          ./p01 decode --bytes "00 00 00 00 00 ff" | tee upside.txt
          grep -q "az -1.0000 g" upside.txt \
            || { echo "upside down did not read minus one gravity"; exit 1; }
          grep -q "magnitude 1.0000" upside.txt \
            || { echo "and its magnitude was not one"; exit 1; }
          ./p01 budget --rate 20 --cooloff 2 --fsync 30 --record 48 --hours 1 \
            | tee budget.txt
          grep -q "a factor of 40" budget.txt \
            || { echo "the cool-off did not come to forty times fewer writes"; exit 1; }
          grep -q "fewer than one fsync per event" budget.txt \
            || { echo "committing on a timer was not reported as such"; exit 1; }
          echo "the sign extension holds, and the wear arithmetic is forty to one"

      - name: P19 builds, with the warnings as errors
        run: make -C p19 all

      - name: P19's suite, with no hardware anywhere
        run: |
          set -e
          make -C p19 check | tee p19-suite.txt
          grep -qE "[0-9]+ checks, 0 failed" p19-suite.txt || {
            echo "p19: no suite summary in that output, so nothing ran"
            exit 1
          }

      - name: P19's stricter conversion pass, reported but not gating
        continue-on-error: true
        run: make -C p19 strict

      - name: P19's other bar does not move
        # The half of the acceptance test a per-axis instrument fails. The
        # sweep tilts a gravity about one axis and reports how far the other
        # angle went, which on this arithmetic is nothing at all.
        run: |
          set -e
          cd p19
          ./p19 sweep --axis pitch | tee pitch.txt
          ./p19 sweep --axis roll | tee roll.txt
          grep -q "roll moved at most 0.000000 degrees" pitch.txt \
            || { echo "roll moved while pitch was swept"; exit 1; }
          grep -q "pitch moved at most 0.000000 degrees" roll.txt \
            || { echo "pitch moved while roll was swept"; exit 1; }
          ./p19 angles --bytes "00 01 00 00 00 00" | tee side.txt
          grep -q "pitch +90.00" side.txt \
            || { echo "a gravity wholly on x is not ninety degrees of pitch"; exit 1; }
          echo "one bar full scale, the other exactly where it was"

      - name: P15 builds, with the warnings as errors
        run: make -C p15 all

      - name: P15's suite, with no chip and no board
        # Two assertions on one output, deliberately in one step. lines.c has
        # a second half for anything that is not Linux, and a suite that
        # quietly compiled that half would pass while testing nothing about
        # the character device, so the device group prints which half it is
        # talking to and this reads it back. It was a step of its own until
        # Sunday 18 October 2026, which made it a step that greps a file an
        # earlier step writes: correct on the runner, and unrunnable on a
        # laptop where the build step is skipped. A check belongs in the step
        # that produces what it reads.
        run: |
          set -e
          make -C p15 check | tee p15-suite.txt
          grep -qE "[0-9]+ checks, 0 failed" p15-suite.txt || {
            echo "p15: no suite summary in that output, so nothing ran"
            exit 1
          }
          grep -q "this build answers: the chip would not open" p15-suite.txt || {
            echo "p15: the suite did not reach the Linux GPIO path, so its"
            echo "device group proved nothing about the character device."
            echo "What it printed was:"
            grep "this build answers" p15-suite.txt || echo "  nothing at all"
            exit 1
          }
          echo "the device group refused a real chip path through the real ioctls"

      - name: P15's stricter conversion pass, reported but not gating
        continue-on-error: true
        run: make -C p15 strict

      - name: P15's plan is the plan, and the refusals refuse
        # The table a sitting is prepared from, read back row by row. Step 3
        # is the chapter's fourth acceptance item: three lines high at once,
        # and the draw of the triple that actually carries meaning.
        run: |
          set -e
          cd p15
          ./p15 plan | tee plan.txt
          grep -qE "^ +0 +0 +600 +100 +7\.4 mA +green$" plan.txt \
            || { echo "step 0 is not green alone at 7.4 mA"; exit 1; }
          grep -qE "^ +3 +1800 +2400 +111 +19\.9 mA +green yellow red$" plan.txt \
            || { echo "step 3 is not three lines high at 19.9 mA"; exit 1; }
          grep -qE "^ +4 +2400 +3000 +000 +0\.0 mA +dark$" plan.txt \
            || { echo "the cycle does not end dark"; exit 1; }
          ./p15 budget | tee budget.txt
          grep -q "chapter quotes 16.5 mA" budget.txt \
            || { echo "the chapter's own figure is not printed"; exit 1; }
          grep -q "they draw 19.9 mA" budget.txt \
            || { echo "this semaphore's own figure is not printed"; exit 1; }
          if [ -e /dev/gpiochip0 ]; then
            echo "this runner has a GPIO chip, which it is not supposed to;"
            echo "the refusal below cannot be checked here, so it is skipped"
          else
            if ./p15 probe > probe.txt 2> probe.err; then
              echo "p15 probe succeeded on a machine with no GPIO chip"
              exit 1
            fi
            grep -q "the chip would not open" probe.err \
              || { echo "the probe failed without naming the chip"; exit 1; }
            echo "and the probe refused a chip that is not there, by name"
          fi

      - name: P10 builds, with the warnings as errors
        run: make -C p10 all

      - name: P10's suite, with no instrument anywhere
        run: |
          set -e
          make -C p10 check | tee p10-suite.txt
          grep -qE "[0-9]+ checks, 0 failed" p10-suite.txt || {
            echo "p10: no suite summary in that output, so nothing ran"
            exit 1
          }

      - name: P10's stricter conversion pass, reported but not gating
        continue-on-error: true
        run: make -C p10 strict

      - name: P10 refuses three traces that overlay
        # The fourth acceptance item, which is the one this lab exists for.
        # Three distinct states pass. The same capture written three times
        # under three names is what a DUT still on its own USB cable
        # produces through the instrument, and it has to be refused by name
        # rather than reported as a tidy little table.
        run: |
          set -e
          cd p10
          ./p10 scene --kind sleep --samples 20000 --out sleep.csv
          ./p10 scene --kind idle  --samples 20000 --out idle.csv
          ./p10 scene --kind ble   --samples 20000 --out ble.csv
          ./p10 scene --kind sleep --samples 20000 --out repeat.csv
          WHY="a dev-board, so the USB-UART silicon leaks"
          ./p10 reduce --source sleep.csv  --state sleep --book run.p10book --why "$WHY"
          ./p10 reduce --source idle.csv   --state idle  --book run.p10book
          ./p10 reduce --source ble.csv    --state ble   --book run.p10book
          ./p10 reduce --source repeat.csv --state sleep --book run.p10book
          ./p10 judge --book run.p10book | tee good.txt
          grep -q "Every item this program can decide is satisfied" good.txt \
            || { echo "three distinct states did not pass"; exit 1; }
          ./p10 scene --kind usb --samples 20000 --out usb.csv
          for s in sleep idle ble sleep; do
            ./p10 reduce --source usb.csv --state $s --book usbrun.p10book --why "$WHY" > /dev/null
          done
          if ./p10 judge --book usbrun.p10book > bad.txt; then
            echo "three traces that overlay were accepted, which is the one"
            echo "run this lab exists to refuse"
            exit 1
          fi
          grep -q "cause is the cable" bad.txt \
            || { echo "the refusal did not send the reader to the cable"; exit 1; }
          echo "a distinct run passes, and three that overlay are refused by name"

      - name: No assembled volume and no PDF is published
        run: |
          set -e
          if git ls-files | grep -E '\.(pdf|html|aux|log|toc|out)$'; then
            echo "A PDF or an HTML file is committed, and neither is ever published."
            echo "What this repository offers is one Markdown lab and one project"
            echo "at a time, which is what mdbuild.py writes. There is deliberately no"
            echo "assembled volume to download. The PDF and the HTML are for the"
            echo "author's own proofreading and stay on the authoring machine."
            exit 1
          fi
          echo "no PDF, no HTML, no assembled volume. Markdown labs only, as intended"

      - name: No private journal and no correspondence is published
        # A per-chapter working record IS publishable now, with machine names
        # removed. What stays local is the private journal kept in the
        # catalogue, which names hosts and paths, and correspondence, which is
        # never anyone else's to read. The guard narrowed from "no journal" to
        # those two by name, so that a public per-lab record is not blocked by
        # a rule written before it was wanted.
        run: |
          set -e
          if git ls-files | grep -iE '(^|/)(private_journal|correspondence)/|(^|/)DIARY[^/]*\.md$'; then
            echo "A private journal or a correspondence file is committed."
            echo "The private journal lives in the catalogue because it names machines"
            echo "and local paths. A public per-chapter record is welcome; that is not"
            echo "the same file."
            exit 1
          fi
          echo "no private journal, no correspondence, as intended"
