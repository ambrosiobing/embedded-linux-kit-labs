name: checks

# The house rules and the Markdown check need a Python interpreter; the lab's
# own program needs a C compiler, and the runner has both. Building the volume
# itself needs a TeX installation and is done locally, so the Markdown check
# regenerates the chapters only, not the figures.
#
# This job is where the C is compiled for the first time. The authoring laptop
# has no compiler, so a red run here is the expected way to find out what it
# has to say, rather than a surprise.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: House rules over every lab
        run: python lint.py

      - name: Every lab has its four figures and a lab line
        run: |
          set -e
          fail=0
          for n in $(seq -w 1 20); do
            test -f "sections/p${n}.tex" || { echo "missing sections/p${n}.tex"; fail=1; }
            grep -q 'project{' "sections/p${n}.tex" || { echo "p${n}: no lab line"; fail=1; }
            for f in arch schematic bench uml; do
              test -f "figures/p${n}_${f}.tex" || { echo "missing figures/p${n}_${f}.tex"; fail=1; }
            done
          done
          test -f sections/front.tex
          test -f sections/appendix.tex
          test -f figures/front_map.tex
          exit $fail

      - name: Every lab has a state, and only the four states exist
        # A status page is worth having only if it cannot drift. This refuses a
        # lab with no row, and a row whose state is a word the ladder does not
        # define, which is how such a page usually rots: a twenty-first state
        # invented in passing to avoid admitting one of the four.
        run: |
          set -e
          fail=0
          for n in $(seq -w 1 20); do
            row=$(grep -E "^\| P${n} \|" STATUS.md || true)
            if [ -z "$row" ]; then
              echo "STATUS.md: no row for P${n}"
              fail=1
              continue
            fi
            state=$(printf '%s\n' "$row" | awk -F'|' '{print $3}' | tr -d ' *')
            case "$state" in
              written|checked|run|passed) ;;
              *) echo "P${n}: state '${state}' is not one of written, checked, run, passed"; fail=1 ;;
            esac
          done
          exit $fail

      - name: The Markdown edition is in step with the source
        run: |
          set -e
          python mdbuild.py >/dev/null
          if ! git diff --quiet -- chapters; then
            echo "chapters/ is behind sections/; run python mdbuild.py and commit"
            git --no-pager diff --stat -- chapters
            exit 1
          fi
          echo "chapters/ matches sections/"

      - name: The lab builds, with the warnings as errors
        run: |
          set -e
          cc --version | head -1
          make -C p04 all

      - name: The lab's own suite, with no hardware anywhere
        run: make -C p04 check

      - name: The stricter conversion pass, reported but not gating
        continue-on-error: true
        run: make -C p04 strict

      - name: P04's command flow, end to end
        run: |
          set -e
          cd p04
          ./p04 synth --kind idle   --blocks 6 --out idle.p04
          ./p04 synth --kind touch  --blocks 6 --out touch.p04
          ./p04 synth --kind speech --blocks 6 --out speech.p04
          ./p04 baseline --source idle.p04 --out book.lab \
              --mounting "continuous integration" \
              --warn 1.5 --fault 3.0 --band-low 2000 --band-high 6000
          ./p04 analyse --source touch.p04  --book book.lab | tee touch.txt
          ./p04 analyse --source speech.p04 --book book.lab | tee speech.txt
          ./p04 replay  --source touch.p04  --book book.lab
          grep -q "WARNING\|FAULT" touch.txt || { echo "a case touch should not read NORMAL"; exit 1; }
          grep -q "^NORMAL" speech.txt         || { echo "a voice should read NORMAL"; exit 1; }
          ./p04 synth --kind idle --blocks 8 --drop 3,4 --out holed.p04
          if ./p04 transport --source holed.p04; then
            echo "transport reported success on a stream with holes in it"
            exit 1
          fi
          echo "the orthogonality demonstration holds and a holed stream is refused"

      - name: A frequency axis that is wrong is refused, not reported
        run: |
          set -e
          cd p04
          ./p04 synth --kind idle --blocks 10 --out honest.p04
          ./p04 baseline --source honest.p04 --out axis.lab \
              --mounting "continuous integration" \
              --warn 1.5 --fault 3.0 --band-low 2000 --band-high 6000
          ./p04 validate --source honest.p04 --book axis.lab
          ./p04 synth --kind idle --blocks 10 --true-rate 30000 --out skewed.p04
          if ./p04 analyse --source skewed.p04 --book axis.lab; then
            echo "a probe running 12 per cent off its claimed rate was reported on"
            exit 1
          fi
          echo "the rate check and the resting invariant both hold"

      - name: No assembled volume and no PDF is published
        run: |
          set -e
          if git ls-files | grep -E '\.(pdf|html|aux|log|toc|out)$'; then
            echo "A PDF or an HTML file is committed, and neither is ever published."
            echo "What this repository offers is one Markdown lab and one project"
            echo "at a time, which is what mdbuild.py writes. There is deliberately no"
            echo "assembled volume to download. The PDF and the HTML are for the"
            echo "author's own proofreading and stay on the authoring machine."
            exit 1
          fi
          echo "no PDF, no HTML, no assembled volume. Markdown labs only, as intended"

      - name: No journal and no correspondence is published
        run: |
          set -e
          if git ls-files | grep -iE '(^|/)(private_journal|correspondence)/|(^|/)DIARY[^/]*\.md$'; then
            echo "A journal or a correspondence file is committed."
            echo "These live in the catalogue, which is local only. A published"
            echo "repository carries the work, never the running record of doing it."
            exit 1
          fi
          echo "no journal, no correspondence, as intended"
