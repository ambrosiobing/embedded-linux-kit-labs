name: checks

# The house rules need nothing but a Python interpreter, so they run on every
# push and on every pull request. Building the volume itself needs a TeX
# installation and is done locally, so the Markdown check regenerates the
# chapters only, not the figures.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: House rules over every lab
        run: python lint.py

      - name: Every lab has its four figures and a lab line
        run: |
          set -e
          fail=0
          for n in $(seq -w 1 20); do
            test -f "sections/p${n}.tex" || { echo "missing sections/p${n}.tex"; fail=1; }
            grep -q 'project{' "sections/p${n}.tex" || { echo "p${n}: no lab line"; fail=1; }
            for f in arch schematic bench uml; do
              test -f "figures/p${n}_${f}.tex" || { echo "missing figures/p${n}_${f}.tex"; fail=1; }
            done
          done
          test -f sections/front.tex
          test -f sections/appendix.tex
          test -f figures/front_map.tex
          exit $fail

      - name: The Markdown edition is in step with the source
        run: |
          set -e
          python mdbuild.py >/dev/null
          if ! git diff --quiet -- chapters; then
            echo "chapters/ is behind sections/; run python mdbuild.py and commit"
            git --no-pager diff --stat -- chapters
            exit 1
          fi
          echo "chapters/ matches sections/"

      - name: The labs' own suite, with no hardware anywhere
        run: |
          set -e
          python -m pip install --quiet numpy
          python -m unittest discover -s tests -t .

      - name: Nothing imports a serial port at module level
        run: |
          set -e
          python - <<'PY'
          import importlib, sys
          for name in ("benchkit.analysis", "benchkit.frames", "benchkit.sources",
                       "benchkit.labbook", "benchkit.timing",
                       "benchkit.invariants", "p04.synth", "p04.pipeline"):
              importlib.import_module(name)
          if "serial" in sys.modules:
              raise SystemExit("pyserial was imported at module level; the live "
                               "command must be the only thing that needs it")
          print("imported every module with no serial dependency")
          PY

      - name: P04's command flow, end to end
        run: |
          set -e
          python -m p04 synth --kind idle   --blocks 6 --out idle.npz
          python -m p04 synth --kind touch  --blocks 6 --out touch.npz
          python -m p04 synth --kind speech --blocks 6 --out speech.npz
          python -m p04 baseline --source idle.npz --out book.json \
              --mounting "continuous integration" \
              --warn 1.5 --fault 3.0 --band-low 2000 --band-high 6000
          python -m p04 analyse --source touch.npz  --book book.json | tee touch.txt
          python -m p04 analyse --source speech.npz --book book.json | tee speech.txt
          python -m p04 replay  --source touch.npz  --book book.json
          grep -q "WARNING\|FAULT" touch.txt || { echo "a case touch should not read NORMAL"; exit 1; }
          grep -q "NORMAL" speech.txt          || { echo "a voice should read NORMAL"; exit 1; }
          python -m p04 synth --kind idle --blocks 8 --drop 3,4 --out holed.npz
          if python -m p04 transport --source holed.npz; then
            echo "transport reported success on a stream with holes in it"
            exit 1
          fi
          echo "the orthogonality demonstration holds and a holed stream is refused"

      - name: A frequency axis that is wrong is refused, not reported
        run: |
          set -e
          python -m p04 synth --kind idle --blocks 10 --out honest.npz
          python -m p04 baseline --source honest.npz --out axis.json \
              --mounting "continuous integration" \
              --warn 1.5 --fault 3.0 --band-low 2000 --band-high 6000
          python -m p04 validate --source honest.npz --book axis.json
          python -m p04 synth --kind idle --blocks 10 --true-rate 30000 --out skewed.npz
          if python -m p04 analyse --source skewed.npz --book axis.json; then
            echo "a probe running 12 per cent off its claimed rate was reported on"
            exit 1
          fi
          echo "the rate check and the resting invariant both hold"

      - name: No built artefacts committed
        run: |
          set -e
          if git ls-files | grep -E '\.(pdf|html|aux|log|toc|out|npz)$|^(book|axis)\.json$'; then
            echo "built artefacts must not be committed; they are rebuilt from source"
            exit 1
          fi
          echo "none committed, as intended"
